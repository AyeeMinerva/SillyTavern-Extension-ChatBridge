<!DOCTYPE html>
<html>
<head>
    <title>ChatBridge Module Test</title>
</head>
<body>
    <h1>ChatBridge Module Loading Test</h1>
    <div id="output"></div>
    
    <script type="module">
        const output = document.getElementById('output');
        
        function log(message, isError = false) {
            const p = document.createElement('p');
            p.textContent = message;
            p.style.color = isError ? 'red' : 'green';
            output.appendChild(p);
        }
        
        async function testModules() {
            // Test 1: SessionManager
            try {
                const { SessionManager } = await import('./src/core/SessionManager.js');
                log('✅ SessionManager loaded successfully');
                const sm = new SessionManager();
                log('✅ SessionManager instance created');
            } catch (error) {
                log(`❌ SessionManager error: ${error.message}`, true);
                console.error(error);
            }
            
            // Test 2: CharacterManager
            try {
                const { CharacterManager } = await import('./src/core/CharacterManager.js');
                log('✅ CharacterManager loaded successfully');
                // Note: Can't create instance without SillyTavern context
                log('⚠️  CharacterManager requires SillyTavern context to instantiate');
            } catch (error) {
                log(`❌ CharacterManager error: ${error.message}`, true);
                console.error(error);
            }
            
            // Test 3: CommandParser
            try {
                const { CommandParser } = await import('./src/core/CommandParser.js');
                log('✅ CommandParser loaded successfully');
                // Can't create without dependencies
                log('⚠️  CommandParser requires CharacterManager and SessionManager');
            } catch (error) {
                log(`❌ CommandParser error: ${error.message}`, true);
                console.error(error);
            }
            
            // Test 4: PlatformAdapter
            try {
                const { PlatformAdapterRegistry } = await import('./src/core/PlatformAdapter.js');
                log('✅ PlatformAdapter loaded successfully');
            } catch (error) {
                log(`❌ PlatformAdapter error: ${error.message}`, true);
                console.error(error);
            }
        }
        
        testModules().then(() => {
            log('=== Test Complete ===');
        });
    </script>
</body>
</html>
